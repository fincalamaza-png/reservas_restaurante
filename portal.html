<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Don Fadrique · Gestión</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/fonts/jost.css">
<link rel="stylesheet" href="/marca/marca-df.css">
<script src="/marca/marca-df.js"></script>
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<meta name="theme-color" content="#f7f4ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Don Fadrique">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --oro:#b8965a; --oro-osc:#8b6a2e; --tinta:#1a1a1a; --crema:#f5f2ee; --crema2:#f0ede8; --borde:#e0dcd6; --gris:#888;
  --ambar:#e0a526; --ambar-bg:#fff4dc; --verde:#2e8b57; --verde-bg:#e3f3ea; --rojo:#a3283a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Jost,"Helvetica Neue",Helvetica,Arial,sans-serif;background:var(--crema);color:var(--tinta);font-size:14px}
input,select,textarea{font-family:inherit}
button{font-family:inherit}
a{color:inherit}
.vista{min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:10;background:var(--crema2);border-bottom:1px solid #d0cac2;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;align-items:center;gap:8px;min-height:56px}
.top .back{background:none;border:none;font-size:22px;padding:4px 8px;cursor:pointer;color:var(--tinta)}
.top .t{flex:1;min-width:0}
.top .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .t small{display:block;font-size:11px;color:var(--gris)}
.top .acc{background:none;border:none;color:var(--oro-osc);font-size:13px;font-weight:700;cursor:pointer;padding:6px 8px}
.content{flex:1;padding:14px;max-width:820px;width:100%;margin:0 auto}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.card h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--oro-osc);margin-bottom:10px}
.muted{color:var(--gris);font-size:12px}
.field{margin-bottom:11px}
.field label{display:block;font-size:12px;color:#666;margin-bottom:4px;font-weight:500}
.field input,.field select,.field textarea,input.in,select.in,textarea.in{width:100%;padding:10px 12px;border:1.5px solid #d0cac2;border-radius:8px;font-size:15px;background:#fff;outline:none;font-family:inherit;color:inherit}
.field input:focus,.field select:focus,.field textarea:focus,input.in:focus,textarea.in:focus{border-color:var(--oro)}
.field textarea,textarea.in{min-height:58px;resize:vertical}
.fila{display:flex;gap:8px}.fila>*{flex:1;min-width:0}
.btn{display:block;width:100%;padding:13px;border-radius:10px;border:none;font-size:15px;font-weight:600;cursor:pointer;text-align:center;text-decoration:none}
.btn+.btn{margin-top:8px}
.btn-p{background:var(--oro);color:#fff}
.btn-s{background:#fff;color:var(--oro-osc);border:1.5px solid var(--oro)}
.btn-d{background:#fff;color:var(--rojo);border:1.5px solid #e4b9c0}
.btn-n{background:var(--tinta);color:#fff}
.btn-sm{display:inline-block;width:auto;padding:8px 12px;font-size:13px;border-radius:8px}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns .btn{flex:1;margin:0;min-width:130px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:7px 14px;border-radius:20px;border:1.5px solid #c8c0b6;background:#fff;font-size:13px;cursor:pointer;color:#555}
.chip.on{background:var(--oro);border-color:var(--oro);color:#fff}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;vertical-align:middle}
.b-ambar{background:var(--ambar-bg);color:#8a5d00}
.b-verde{background:var(--verde-bg);color:#1d6640}
.b-gris{background:#eee;color:#666}
.b-oro{background:#f5ecd8;color:var(--oro-osc)}
.sw-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.sw{position:relative;width:44px;height:24px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0}
.sw-sl{position:absolute;inset:0;background:#ccc;border-radius:24px;cursor:pointer;transition:.25s}
.sw-sl:before{content:'';position:absolute;width:18px;height:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.25s}
.sw input:checked+.sw-sl{background:var(--oro)}
.sw input:checked+.sw-sl:before{transform:translateX(20px)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tinta);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.vacio{text-align:center;color:var(--gris);padding:26px 10px;font-size:13px}
.cargando{text-align:center;color:var(--gris);padding:40px 10px}

/* ── Portada y paletas: blanco roto con botones cuadrados ── */
.home{background:#f7f4ee;color:var(--tinta);min-height:calc(100vh - 72px);display:flex;flex-direction:column;padding:calc(22px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom))}
.home-cab{text-align:center;margin:22px 0 30px}
.home-cab .k{font-size:10px;letter-spacing:6px;color:var(--oro);font-weight:500;padding-left:6px}
.home-cab .n{font-size:28px;letter-spacing:9px;font-weight:300;margin:8px 0 6px;padding-left:9px}
.home-cab .df-logo{--t:28px}
.home-cab .l{font-size:11px;color:#9a9086;letter-spacing:2px;margin-top:14px}
.home-cab .lin{width:34px;height:1px;background:#cbbd9e;margin:16px auto 0}
.cuadros{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:560px;width:100%;margin:0 auto}
.cuadro{aspect-ratio:1/1;background:#fff;border:1px solid #e6dfd3;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px;text-align:center;color:var(--tinta);text-decoration:none;cursor:pointer;box-shadow:0 1px 3px rgba(60,45,20,.05);transition:transform .12s,border-color .12s,box-shadow .12s;font-family:inherit}
.cuadro:hover{border-color:var(--oro);box-shadow:0 4px 14px rgba(60,45,20,.08)}
.cuadro:active{transform:scale(.97)}
.cuadro .ic{width:58px;height:58px;border-radius:16px;background:#f5efe3;display:flex;align-items:center;justify-content:center;font-size:28px}
.cuadro b{font-size:14px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;line-height:1.3}
.cuadro small{font-size:11px;color:#9a9086;line-height:1.3;margin-top:-6px}
.home-pie{margin-top:auto;padding-top:28px;text-align:center;font-size:12px;color:#9a9086}
.home-pie button{background:none;border:none;color:#7d756b;text-decoration:underline;font-size:12px;cursor:pointer;margin-left:6px;font-family:inherit}
.home .volver{background:none;border:none;color:var(--tinta);font-size:24px;cursor:pointer;padding:4px 8px;align-self:flex-start}
.vacio-home{grid-column:1/-1;text-align:center;color:#9a9086;padding:20px}
@keyframes latido{0%,100%{opacity:1}50%{opacity:.25}}
@media(min-width:700px){.cuadros{grid-template-columns:repeat(3,1fr);max-width:720px}}

/* Listas */
.item{display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-size:14px}
.item .tx small{display:block;color:var(--gris);font-size:12px;margin-top:2px}
.item .der{text-align:right;flex-shrink:0;font-size:13px}
.item .acciones{display:flex;gap:6px;flex-shrink:0}
.sec-tit{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gris);margin:18px 2px 8px;font-weight:700}

/* Carta */
.plato-row{display:flex;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid #f0ede8}
.plato-row:last-child{border-bottom:none}
.plato-row input.nom{flex:1;min-width:0;padding:8px 10px;border:1.5px solid transparent;border-radius:8px;font-size:14px;background:#faf8f5}
.plato-row input.pre{width:78px;padding:8px;border:1.5px solid transparent;border-radius:8px;font-size:14px;text-align:right;background:#faf8f5}
.plato-row input:focus{border-color:var(--oro);background:#fff;outline:none}
.plato-row.fuera input{color:#aaa;text-decoration:line-through}
.fam-cab{display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.fam-cab b{font-family:Georgia,serif;font-size:16px}

/* Editor de secciones */
.sec{border:1.5px solid var(--borde);border-radius:10px;padding:10px;margin-bottom:10px;background:#fff}
.sec-h{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.sec-h input{flex:1;font-weight:600;padding:8px 10px;border:1.5px solid #e6e1da;border-radius:8px;font-size:14px}
.sec-h .tp{font-size:10px;color:var(--gris);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.mini{background:#f3efe9;border:none;border-radius:7px;width:32px;height:32px;font-size:14px;cursor:pointer;color:#555;flex-shrink:0}
.mini:hover{background:#e9e2d8}
.lst-row{display:flex;gap:6px;margin-bottom:6px}
.lst-row input{flex:1}
.add-sec{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}

/* Calendario */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-nav button{border:none;background:none;font-size:24px;cursor:pointer;color:var(--oro-osc);padding:0 10px}
.cal-nav b{font-size:15px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-h{text-align:center;font-size:10px;color:var(--gris);font-weight:700;padding:4px 0}
.cal-d{min-height:46px;border-radius:8px;background:#faf8f5;padding:4px 3px;font-size:12px;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px}
.cal-d.otro{opacity:.35}
.cal-d.hoy{outline:2px solid var(--oro)}
.cal-d.sel{background:#f5ecd8}
.cal-d.bloq{background:var(--ambar-bg)}
.cal-d.conf{background:var(--verde-bg)}
.cal-d .n{font-weight:600}
.cal-d .pt{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.cal-d .pt i{width:7px;height:7px;border-radius:50%;display:block}
.pt-a{background:var(--ambar)}.pt-v{background:var(--verde)}
.leyenda{display:flex;gap:14px;font-size:12px;color:#666;margin-top:10px;flex-wrap:wrap}
.leyenda i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.celeb{border-left:5px solid var(--ambar)}
.celeb.conf{border-left-color:var(--verde)}
.celeb.canc{border-left-color:#bbb;opacity:.7}

/* Contabilidad */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:10px}
.kpi{background:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.kpi small{display:block;font-size:11px;color:var(--gris);text-transform:uppercase;letter-spacing:.06em}
.kpi b{display:block;font-size:21px;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi.grande{grid-column:1/-1;background:var(--tinta);color:#fff}
.kpi.grande small{color:#b9b0a4}
.kpi.grande b{font-size:28px;color:#e9d6ac}
.tabla{width:100%;border-collapse:collapse;font-size:13px}
.tabla td,.tabla th{padding:7px 4px;border-bottom:1px solid #f0ede8;text-align:left}
.tabla th{font-size:11px;color:var(--gris);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.tabla .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.barras{display:flex;align-items:flex-end;gap:2px;height:90px;margin-top:6px}
.barras div{flex:1;background:var(--oro);border-radius:2px 2px 0 0;min-height:1px;position:relative}
.barras div:hover{background:var(--oro-osc)}
.ejes{display:flex;justify-content:space-between;font-size:10px;color:var(--gris);margin-top:4px}

/* PIN */
#pin{display:none;position:fixed;inset:0;z-index:99999;background:#f7f4ee;color:var(--tinta);flex-direction:column;align-items:center;justify-content:center;padding:24px}
#pin .n{font-size:30px;font-weight:300;letter-spacing:10px;padding-left:10px;text-align:center}
#pin .k{font-size:11px;letter-spacing:7px;padding-left:7px;color:var(--oro);font-weight:500;margin-top:10px}
#pin .pin-premios{margin-top:34px;--h:32px}
#df-pie{padding:18px 0 calc(22px + env(safe-area-inset-bottom));opacity:.9}
#df-pie:empty{display:none}
.top .df-logo{--t:11px;flex:none}
@media(max-width:699px){.top .df-logo{display:none}}
@media(max-height:700px){#pin .pin-premios{display:none}}
#pin .txt{font-size:13px;color:#9a9086;letter-spacing:1px;margin-bottom:16px}
#pin-puntos{display:flex;gap:14px;margin-bottom:10px}
#pin-error{height:20px;font-size:13px;color:var(--rojo);margin-bottom:12px}
#pin-teclado{display:grid;grid-template-columns:repeat(3,72px);gap:16px}
#pin-teclado button{height:72px;border-radius:50%;border:1px solid #e6dfd3;font-size:24px;font-weight:300;color:var(--tinta);background:#fff;cursor:pointer;font-family:inherit;box-shadow:0 1px 3px rgba(60,45,20,.05)}
#pin-teclado button:active{background:#f5efe3}
#pin-teclado button:disabled{background:transparent;border:none;box-shadow:none}

@media(min-width:700px){
  .paleta{grid-template-columns:repeat(3,1fr)}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .cal-d{min-height:64px}
}
</style>
</head>
<body>
<div id="pin">
  <div data-df-logo="Gestión" style="--t:30px;margin-bottom:26px"></div>
  <div class="txt">Introduce tu PIN</div>
  <div id="pin-puntos"></div>
  <div id="pin-error"></div>
  <div id="pin-teclado"></div>
  <div data-df-premios class="pin-premios"></div>
</div>
<div id="app"></div>
<div id="df-pie" data-df-premios style="--h:30px"></div>
<div class="toast" id="toast"></div>
<script src="/menu-render.js"></script>
<script>
'use strict';
// ════════════════════════════════════════════════════════════════════════
//  CONFIGURACIÓN
// ════════════════════════════════════════════════════════════════════════
var URL_HOTEL = 'https://hotel.palaciocondealdana.com';
var URL_TPV = 'https://gestion.palaciocondealdana.com';
var LUGARES = ['Don Fadrique', 'La Cúpula (Don Fadrique)', 'Zona de piscina (Don Fadrique)', 'Palacio Conde Aldana', 'Las Úrsulas', 'Bodega Díscolo', 'Catering en otro lugar'];
var MENUS_RESTAURANTE = ['Reunión Familiar Tradicional 1', 'Reunión Familiar Tradicional 2', 'Menú Sabor de la Memoria', 'Menú Instinto'];

var ST = { usuario: null, admin: false, modulos: [], plantillas: null };
var RESTAURANTE = ['reservas', 'tpv', 'carta', 'bodas', 'comuniones', 'contabilidad'];
var NOMBRES_MOD = { pagos: 'Anotar pagos y gastos fijos', hotel: 'Hotel', reservas: 'Reservas', tpv: 'TPV Restaurante', carta: 'Carta y Menús', bodas: 'Bodas', comuniones: 'Comuniones', eventos: 'Eventos', contabilidad: 'Administración y Contabilidad' };
// ¿Puede el usuario entrar? (texto o lista de módulos; 'admin' solo administradores)
function puede(m){
  if (ST.admin) return true;
  if (m === 'admin') return false;
  return (Array.isArray(m) ? m : [m]).some(function(x){ return ST.modulos.indexOf(x) > -1; });
}

// ════════════════════════════════════════════════════════════════════════
//  UTILIDADES
// ════════════════════════════════════════════════════════════════════════
var esc = DFMenu.esc, euros = DFMenu.euros;
function $(id){ return document.getElementById(id); }
function toast(t){ var e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(function(){ e.classList.remove('on'); }, 2200); }
function hoyISO(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function fechaCorta(iso){ if (!iso) return ''; var d = new Date(iso + 'T12:00:00'); return d.toLocaleDateString('es-ES', { weekday:'short', day:'numeric', month:'short', year:'numeric' }); }
function fechaLarga(iso){ return DFMenu.fechaLarga(iso); }
function fechaSinAno(iso){ if (!iso) return ''; var d = new Date(iso + 'T12:00:00'); return d.toLocaleDateString('es-ES', { weekday:'short', day:'numeric', month:'short' }); }
function mesTxt(y, m){ var t = new Date(y, m - 1, 1).toLocaleDateString('es-ES', { month: 'long', year: 'numeric' }); return t.charAt(0).toUpperCase() + t.slice(1); }
function clon(o){ return JSON.parse(JSON.stringify(o)); }
function n2(v){ var n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isFinite(n) ? n : 0; }
function attr(v){ return esc(v == null ? '' : v); }

function api(metodo, url, cuerpo){
  var o = { method: metodo, credentials: 'same-origin', headers: {} };
  if (cuerpo !== undefined) { o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(cuerpo); }
  return fetch(url, o).then(function(r){
    if (r.status === 401) { mostrarPin(); throw new Error('Sesión caducada'); }
    return r.json().catch(function(){ return {}; }).then(function(d){
      if (!r.ok) throw new Error(d.error || ('Error ' + r.status));
      return d;
    });
  });
}
function fallo(e){ toast(e.message || 'Error'); }

function plantillas(forzar){
  if (ST.plantillas && !forzar) return Promise.resolve(ST.plantillas);
  return api('GET', '/api/portal/plantillas').then(function(d){ ST.plantillas = d; return d; });
}

// ════════════════════════════════════════════════════════════════════════
//  ACCESO CON PIN (misma sesión que la app de reservas)
// ════════════════════════════════════════════════════════════════════════
var PIN = '', enviandoPin = false;
function pintarPin(){ var p = $('pin-puntos'); p.innerHTML = ''; for (var i = 0; i < 4; i++) { var d = document.createElement('div'); d.style.cssText = 'width:13px;height:13px;border-radius:50%;border:1.5px solid #b8965a;' + (i < PIN.length ? 'background:#b8965a' : ''); p.appendChild(d); } }
function teclaPin(k){
  if (enviandoPin) return;
  $('pin-error').textContent = '';
  if (k === '⌫') PIN = PIN.slice(0, -1); else if (PIN.length < 4) PIN += k;
  pintarPin();
  if (PIN.length === 4) entrarPin();
}
function entrarPin(){
  enviandoPin = true;
  fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin: PIN }) })
    .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, d: d }; }); })
    .then(function(x){
      enviandoPin = false;
      if (x.ok) { try { localStorage.setItem('df_usuario', x.d.usuario); } catch(e) {} $('pin').style.display = 'none'; cargarSesion(); }
      else { PIN = ''; pintarPin(); $('pin-error').textContent = x.d.error || 'PIN incorrecto'; }
    }).catch(function(){ enviandoPin = false; PIN = ''; pintarPin(); $('pin-error').textContent = 'Sin conexión'; });
}
function mostrarPin(){
  var o = $('pin'); if (o.style.display === 'flex') return;
  var t = $('pin-teclado'); t.innerHTML = '';
  ['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(function(k){
    var b = document.createElement('button'); b.type = 'button'; b.textContent = k;
    if (k) b.onclick = function(){ teclaPin(k); }; else b.disabled = true;
    t.appendChild(b);
  });
  PIN = ''; pintarPin(); o.style.display = 'flex';
}
document.addEventListener('keydown', function(e){
  if ($('pin').style.display !== 'flex') return;
  if (/^[0-9]$/.test(e.key)) teclaPin(e.key); else if (e.key === 'Backspace') teclaPin('⌫');
});
function cerrarSesion(){
  if (!confirm('¿Cerrar sesión en este dispositivo?')) return;
  fetch('/api/logout', { method: 'POST' }).then(function(){ location.hash = ''; location.reload(); });
}

// ════════════════════════════════════════════════════════════════════════
//  NAVEGACIÓN
// ════════════════════════════════════════════════════════════════════════
function ir(h){ if (location.hash === h) render(); else location.hash = h; }
window.addEventListener('hashchange', render);
var SUCIO = false; // cambios sin guardar en un editor
window.addEventListener('beforeunload', function(e){ if (SUCIO) { e.preventDefault(); e.returnValue = ''; } });

function cabecera(titulo, sub, atras, accion){
  return '<div class="top">' + (atras ? '<button class="back" onclick="volverA(\'' + atras + '\')">&#8592;</button>' : '') +
    '<div class="t"><b>' + esc(titulo) + '</b>' + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</div>' + (accion || '') + DFMarca.logo('', 'fila') + '</div>';
}
function volverA(h){
  if (SUCIO && !confirm('Hay cambios sin guardar. ¿Salir sin guardar?')) return;
  SUCIO = false; ir(h);
}

function render(){
  if (!ST.usuario) return;
  var h = location.hash.replace(/^#\/?/, '');
  var p = h.split('/');
  var app = $('app');
  window.scrollTo(0, 0);
  SUCIO = false;
  if (PANEL_T) { clearInterval(PANEL_T); PANEL_T = null; }
  if (!h) return vHome(app);
  var nec = { restaurante: ['reservas', 'carta'], carta: 'carta', menus: 'carta', menu: ['carta', 'bodas', 'comuniones', 'eventos'], personalizados: 'carta', personalizado: 'carta',
    bodas: 'bodas', comuniones: 'comuniones', 'otros-eventos': 'eventos', eventos: EVENTOS, celebracion: EVENTOS, contabilidad: 'contabilidad', admin: 'contabilidad', documentos: 'contabilidad', facturacion: 'contabilidad', gastos: 'contabilidad', gasto: 'contabilidad', panel: 'contabilidad', pagos: 'contabilidad', pago: 'contabilidad', personal: 'admin', trabajador: 'admin', documento: 'contabilidad', usuarios: 'admin' }[p[0]];
  if (nec && !puede(nec)) { toast('No tienes acceso a esa sección'); location.hash = ''; return; }
  switch (p[0]) {
    case 'usuarios': return vUsuarios(app);
    case 'restaurante': return vRestaurante(app);
    case 'carta': return vCarta(app);
    case 'menus': return vMenus(app);
    case 'menu': return vEditorPlantilla(app, p[1]);
    case 'personalizados': return vPersonalizados(app);
    case 'personalizado': return vEditorPersonalizado(app, p[1]);
    case 'bodas': return vCelebraciones(app, 'boda', p[1]);
    case 'comuniones': return vCelebraciones(app, 'comunion', p[1]);
    case 'otros-eventos': return vCelebraciones(app, 'evento', p[1]);
    case 'eventos': return vEventos(app);
    case 'admin': return vAdminPaleta(app);
    case 'documentos': return vAdmin(app);
    case 'facturacion': return vPanel(app, 'mes', p[1]);
    case 'panel': return vPanel(app, p[1], p[2], p[3]);
    case 'pagos': return vPagos(app, p[1]);
    case 'pago': return vPago(app, p[1]);
    case 'gastos': return vGastos(app, p[1]);
    case 'gasto': return vGasto(app, p[1]);
    case 'personal': return vPersonal(app);
    case 'trabajador': return vTrabajador(app, p[1], p[2]);
    case 'documento': return vDocumento(app, p[1], p[2]);
    case 'celebracion': return vCelebracion(app, p[1], p[2], p[3]);
    case 'contabilidad': return vContabilidad(app, p[1]);
    default: return vHome(app);
  }
}

function cuadro(icono, titulo, sub, accion){
  var ext = accion.indexOf('http') === 0, pag = accion.indexOf('/') === 0;
  var abre = (ext || pag) ? '<a class="cuadro" href="' + accion + '"' + (ext ? ' target="_blank" rel="noopener"' : '') + '>' : '<button class="cuadro" onclick="ir(\'' + accion + '\')">';
  return abre + '<div class="ic">' + icono + '</div><b>' + titulo + '</b>' + (sub ? '<small>' + sub + '</small>' : '') + ((ext || pag) ? '</a>' : '</button>');
}
function cabeceraHome(k, n, atras){
  return (atras ? '<button class="volver" onclick="ir(\'' + atras + '\')">&#8592;</button>' : '') +
    '<div class="home-cab"' + (atras ? ' style="margin-top:0"' : '') + '>' + DFMarca.logo(k) + (atras ? '' : '<div class="l">Alba de Tormes · Salamanca</div>') + '</div>';
}
var EVENTOS = ['bodas', 'comuniones', 'eventos'];
function vHome(app){
  var h = (puede('hotel') ? cuadro('&#128719;', 'Hotel', 'Planning y habitaciones', URL_HOTEL) : '') +
    (puede(['reservas', 'carta']) ? cuadro('&#127869;', 'Restaurante', 'Reservas, carta y menús', '#/restaurante') : '') +
    (puede(EVENTOS) ? cuadro('&#127881;', 'Eventos', 'Bodas, comuniones y eventos', '#/eventos') : '') +
    (puede('tpv') ? cuadro('&#128179;', 'TPV Restaurante', 'Comandas, cobros y caja', URL_TPV) : '') +
    (puede('contabilidad') ? cuadro('&#128202;', 'Administración y Contabilidad', '', '#/admin') : '') +
    (ST.admin ? cuadro('&#128101;', 'Usuarios', 'PIN y permisos', '#/usuarios') : '');
  app.innerHTML = '<div class="home">' + cabeceraHome('GESTIÓN', 'DON FADRIQUE') +
    '<div class="cuadros">' + (h || '<div class="vacio-home">Todavía no tienes acceso a ninguna sección. Pídeselo a Manuel o a Nicolás.</div>') + '</div>' +
    '<div class="home-pie">' + esc(ST.usuario || '') + '<button onclick="cerrarSesion()">Cerrar sesión</button></div></div>';
}
function vRestaurante(app){
  app.innerHTML = '<div class="home">' + cabeceraHome('RESTAURANTE', 'DON FADRIQUE', '#/') + '<div class="cuadros">' +
    (puede('reservas') ? cuadro('&#128197;', 'Reservas', 'Mesas, eventos y propuestas', '/reservas') : '') +
    (puede('carta') ? cuadro('&#128214;', 'Carta y Menús', 'Carta, menús y personalizados', '#/carta') : '') +
    '</div></div>';
}
function vEventos(app){
  app.innerHTML = '<div class="home">' + cabeceraHome('EVENTOS', 'DON FADRIQUE', '#/') + '<div class="cuadros">' +
    (puede('bodas') ? cuadro('&#128141;', 'Bodas', 'Calendario, fichas y fianzas', '#/bodas') : '') +
    (puede('comuniones') ? cuadro('&#128330;', 'Comuniones', 'Calendario, fichas y fianzas', '#/comuniones') : '') +
    (puede('eventos') ? cuadro('&#127881;', 'Eventos', 'Empresa, cumpleaños, bautizos…', '#/otros-eventos') : '') +
    '</div></div>';
}

function pestanasCarta(activa){
  var t = function(id, txt, h){ return '<button class="chip' + (activa === id ? ' on' : '') + '" onclick="volverA(\'' + h + '\')">' + txt + '</button>'; };
  return '<div class="chips">' + t('carta', 'Carta', '#/carta') + t('menus', 'Menús', '#/menus') + t('pers', 'Personalizados', '#/personalizados') + '</div>';
}

// ── Carta (los platos y precios son los del TPV) ──
var CARTA = null;
function vCarta(app){
  app.innerHTML = '<div class="vista">' + cabecera('Carta y Menús', 'Carta del restaurante', '#/restaurante') +
    '<div class="content">' + pestanasCarta('carta') + '<div id="carta-body"><div class="cargando">Cargando la carta del TPV…</div></div></div></div>';
  api('GET', '/api/portal/tpv/carta').then(function(d){ CARTA = d; pintarCarta(); })
    .catch(function(e){
      $('carta-body').innerHTML = '<div class="card"><b>No se puede abrir la carta ahora</b><p class="muted" style="margin-top:6px">' + esc(e.message) + '</p>' +
        '<p class="muted" style="margin-top:6px">La carta se guarda en el TPV para que los precios sean siempre los mismos que se cobran. Comprueba que el TPV funciona y vuelve a intentarlo.</p>' +
        '<div class="btns" style="margin-top:12px"><button class="btn btn-s" onclick="vCarta($(\'app\'))">Reintentar</button><a class="btn btn-n" href="' + URL_TPV + '/propietario.html" target="_blank" rel="noopener">Abrir el TPV</a></div></div>';
    });
}
function pintarCarta(){
  var d = CARTA, h = '';
  h += '<div class="card"><div class="fila" style="align-items:flex-end">' +
    '<div class="field" style="margin:0"><label>Temporada</label><select id="temporada" onchange="cambiarTemporada(this.value)">' +
    ['Primavera','Verano','Otoño','Invierno'].map(function(t){ return '<option' + (t === d.temporada ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select></div>' +
    '<a class="btn btn-p" style="margin:0" href="/api/portal/tpv/carta-pdf" target="_blank" rel="noopener">&#128424; Imprimir carta</a></div>' +
    '<p class="muted" style="margin-top:10px">Se imprime con el formato de siempre. Los cambios de nombre y precio se guardan solos y también cambian en el TPV.</p></div>';
  d.familias.forEach(function(f){
    var prods = d.productos.filter(function(p){ return p.familia_id === f.id; });
    h += '<div class="card"><div class="fam-cab"><b>' + esc(f.nombre) + '</b><span class="muted">' + prods.filter(function(p){ return p.disponible; }).length + ' en carta</span></div><div style="margin-top:8px">';
    prods.forEach(function(p){
      h += '<div class="plato-row' + (p.disponible ? '' : ' fuera') + '" id="pr-' + p.id + '">' +
        '<input class="nom" value="' + attr(p.nombre) + '" onchange="guardarPlato(' + p.id + ',{nombre:this.value})">' +
        '<input class="pre" inputmode="decimal" value="' + (p.precio != null ? String(Number(p.precio).toFixed(2)).replace('.', ',') : '') + '" onchange="guardarPlato(' + p.id + ',{precio:this.value})">' +
        '<label class="sw" title="En carta"><input type="checkbox"' + (p.disponible ? ' checked' : '') + ' onchange="guardarPlato(' + p.id + ',{disponible:this.checked})"><span class="sw-sl"></span></label></div>';
    });
    if (!prods.length) h += '<div class="muted" style="padding:6px 0">Sin platos</div>';
    h += '</div><div class="fila" style="margin-top:10px"><input class="in" id="np-' + f.id + '" placeholder="Nuevo plato"><input class="in" id="npp-' + f.id + '" inputmode="decimal" placeholder="Precio" style="max-width:96px"><button class="btn btn-s btn-sm" style="flex:0 0 auto" onclick="nuevoPlato(' + f.id + ')">Añadir</button></div></div>';
  });
  h += '<p class="muted" style="text-align:center;margin:6px 0 20px">El interruptor indica si el plato sale en la carta. Al quitarlo, el plato pasa a "fuera de carta" en el TPV.</p>';
  $('carta-body').innerHTML = h;
}
function guardarPlato(id, cambios){
  if (cambios.precio !== undefined) cambios.precio = n2(cambios.precio);
  api('PUT', '/api/portal/tpv/productos/' + id, cambios).then(function(){
    var p = CARTA.productos.filter(function(x){ return x.id === id; })[0];
    if (p) Object.keys(cambios).forEach(function(k){ p[k] = k === 'disponible' ? (cambios[k] ? 1 : 0) : cambios[k]; });
    if (cambios.disponible !== undefined) $('pr-' + id).classList.toggle('fuera', !cambios.disponible);
    toast('Guardado en el TPV');
  }).catch(fallo);
}
function nuevoPlato(fid){
  var nom = $('np-' + fid).value.trim(); if (!nom) return toast('Escribe el nombre del plato');
  api('POST', '/api/portal/tpv/productos', { familia_id: fid, nombre: nom, precio: n2($('npp-' + fid).value) })
    .then(function(){ toast('Plato añadido'); vCarta($('app')); }).catch(fallo);
}
function cambiarTemporada(v){ api('PUT', '/api/portal/tpv/temporada', { valor: v }).then(function(){ CARTA.temporada = v; toast('Temporada: ' + v); }).catch(fallo); }

// ── Menús (plantillas) ──
function tipoMenu(p){
  if (MENUS_RESTAURANTE.indexOf(p.nombre) > -1) return 'rest';
  if (p.tipo === 'boda') return 'boda';
  if (p.tipo === 'comunion') return 'comunion';
  return 'eventos';
}
function tarjetaMenu(p){
  return '<div class="item" onclick="ir(\'#/menu/' + p.id + '\')"><div class="tx"><b>' + esc(p.nombre) + '</b><small>' +
    (p.formato === 'triptico' ? '<span class="badge b-oro">A4 horizontal · 3 menús por hoja</span> ' : '<span class="badge b-gris">A4</span> ') +
    (Number(p.precio_persona) ? euros(p.precio_persona) + ' / persona' : 'Sin precio') + '</small></div>' +
    '<div class="acciones"><a class="btn btn-s btn-sm" href="/menu.html?plantilla=' + p.id + '" onclick="event.stopPropagation()">&#128424;</a></div></div>';
}
function vMenus(app){
  app.innerHTML = '<div class="vista">' + cabecera('Carta y Menús', 'Menús', '#/restaurante', '<button class="acc" onclick="nuevaPlantilla()">+ Nuevo</button>') +
    '<div class="content">' + pestanasCarta('menus') + '<div id="menus-body"><div class="cargando">Cargando…</div></div></div></div>';
  plantillas(true).then(function(ps){
    var grupos = { rest: [], eventos: [], boda: [], comunion: [] };
    ps.forEach(function(p){ grupos[tipoMenu(p)].push(p); });
    grupos.rest.sort(function(a, b){ return MENUS_RESTAURANTE.indexOf(a.nombre) - MENUS_RESTAURANTE.indexOf(b.nombre); });
    var h = '<div class="sec-tit">Menús del restaurante</div>' + (grupos.rest.map(tarjetaMenu).join('') || '<div class="vacio">—</div>');
    h += '<div class="sec-tit">Propuestas a clientes</div>' +
      '<a class="item" href="/reservas#p-propuestas" style="text-decoration:none"><div class="tx"><b>&#9993; Preparar y enviar una propuesta</b><small>Elegir menús, personalizar, enviar PDF y que el cliente confirme y firme online</small></div><div class="der">&#8250;</div></a>' +
      '<a class="item" href="/reservas#p-propuestas-lista" style="text-decoration:none"><div class="tx"><b>&#128194; Entregados</b><small>Propuestas enviadas, confirmadas y firmadas</small></div><div class="der">&#8250;</div></a>';
    h += '<div class="sec-tit">Menús de eventos</div>' + (grupos.eventos.map(tarjetaMenu).join('') || '<div class="vacio">—</div>');
    h += '<div class="sec-tit">Bodas</div>' + (grupos.boda.map(tarjetaMenu).join('') || '<div class="vacio">—</div>');
    h += '<div class="sec-tit">Comuniones</div>' + (grupos.comunion.map(tarjetaMenu).join('') || '<div class="vacio">—</div>');
    h += '<p class="muted" style="text-align:center;margin:16px 0 24px">Estos menús son los mismos que aparecen al preparar una propuesta en Reservas: si cambias uno aquí, cambia allí también.</p>';
    $('menus-body').innerHTML = h;
  }).catch(fallo);
}
function nuevaPlantilla(tipo){
  plantillas().then(function(ps){
    var nombre = prompt('Nombre del nuevo menú', tipo === 'boda' ? 'Menú de Boda 2' : tipo === 'comunion' ? 'Menú de Comunión 2' : 'Nuevo menú');
    if (!nombre) return;
    var base = ps.filter(function(p){ return p.tipo === tipo; })[0] || ps.filter(function(p){ return p.nombre === 'Reunión Familiar Tradicional 2'; })[0] || ps[0];
    var secc = base ? clon(base.secciones) : [];
    // Se copia la estructura vacía del menú base
    secc.forEach(function(s){ if (s.tipo === 'plato') s.texto = ''; if (s.tipo === 'lista') s.items = s.items.map(function(){ return ''; }); if (s.tipo === 'eleccion') s.opciones = s.opciones.map(function(){ return ''; }); });
    api('POST', '/api/portal/plantillas', { nombre: nombre, tipo: tipo || (base && base.tipo) || 'comida', secciones: secc, precio_persona: 0, formato: 'a4' })
      .then(function(p){ ST.plantillas = null; ir('#/menu/' + p.id); }).catch(fallo);
  }).catch(fallo);
}

// ════════════════════════════════════════════════════════════════════════
//  EDITOR DE SECCIONES (platos, listas, a elegir, sí/no, barra libre, recena)
//  Mismo formato que las propuestas de la app de reservas.
// ════════════════════════════════════════════════════════════════════════
var ED = null; // { secciones: [...] }
var TIPOS = { plato: 'Plato', lista: 'Lista de platos', eleccion: 'Plato / a elegir', sino: 'Sí / No', barra_libre: 'Barra libre', recena: 'Recena' };
function marcar(){ SUCIO = true; }
function setS(i, k, v){ ED.secciones[i][k] = v; marcar(); }
function setSub(i, k, j, v){ ED.secciones[i][k][j] = v; marcar(); }
function setRec(i, j, k, v){ ED.secciones[i].platos[j][k] = k === 'precio' ? n2(v) : v; marcar(); }

function htmlSecciones(){
  var h = '';
  ED.secciones.forEach(function(s, i){
    var b = 'ED.secciones[' + i + ']';
    h += '<div class="sec"><div class="sec-h">' +
      '<input value="' + attr(s.titulo) + '" oninput="setS(' + i + ',\'titulo\',this.value)">' +
      '<span class="tp">' + (TIPOS[s.tipo || 'plato'] || '') + '</span>' +
      '<button class="mini" onclick="moverSec(' + i + ',-1)" title="Subir">&#8593;</button>' +
      '<button class="mini" onclick="moverSec(' + i + ',1)" title="Bajar">&#8595;</button>' +
      '<button class="mini" onclick="quitarSec(' + i + ')" title="Quitar">&#10005;</button></div>';
    var t = s.tipo || 'plato';
    if (t === 'plato') {
      h += '<textarea class="in" rows="2" placeholder="Plato" oninput="setS(' + i + ',\'texto\',this.value)">' + esc(s.texto || '') + '</textarea>';
      h += '<label style="display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:#666"><input type="checkbox"' + (s.compartir ? ' checked' : '') + ' onchange="setS(' + i + ',\'compartir\',this.checked)"> Para compartir</label>';
    } else if (t === 'lista') {
      (s.items || []).forEach(function(it, j){
        h += '<div class="lst-row"><input class="in" value="' + attr(it) + '" placeholder="Plato ' + (j+1) + '" oninput="setSub(' + i + ',\'items\',' + j + ',this.value)"><button class="mini" onclick="quitarItem(' + i + ',' + j + ')">&#10005;</button></div>';
      });
      h += '<div class="btns"><button class="btn btn-s btn-sm" style="flex:0 0 auto;min-width:0" onclick="addItem(' + i + ')">+ Añadir plato</button>' +
        '<label style="display:flex;align-items:center;gap:6px;font-size:12px;color:#666;margin-left:auto"><input type="checkbox"' + (s.compartir ? ' checked' : '') + ' onchange="setS(' + i + ',\'compartir\',this.checked)"> Para compartir</label></div>';
    } else if (t === 'eleccion') {
      h += '<div class="sw-row"><span style="font-size:13px">A elegir entre varias opciones</span><label class="sw"><input type="checkbox"' + (s.elegir ? ' checked' : '') + ' onchange="setS(' + i + ',\'elegir\',this.checked);repintarEd()"><span class="sw-sl"></span></label></div>';
      if (!s.opciones || !s.opciones.length) s.opciones = [''];
      if (s.elegir) {
        s.opciones.forEach(function(op, j){
          h += '<div class="lst-row"><input class="in" value="' + attr(op) + '" placeholder="Opción ' + (j+1) + '" oninput="setSub(' + i + ',\'opciones\',' + j + ',this.value)"><button class="mini" onclick="quitarOpcion(' + i + ',' + j + ')">&#10005;</button></div>';
        });
        h += '<button class="btn btn-s btn-sm" onclick="addOpcion(' + i + ')">+ Añadir opción</button>';
      } else {
        h += '<textarea class="in" rows="2" placeholder="Plato" oninput="setSub(' + i + ',\'opciones\',0,this.value)">' + esc(s.opciones[0] || '') + '</textarea>';
      }
    } else if (t === 'sino') {
      h += '<div class="sw-row"><span style="font-size:13px">Incluir ' + esc((s.titulo || '').toLowerCase()) + '</span><label class="sw"><input type="checkbox"' + (s.valor ? ' checked' : '') + ' onchange="setS(' + i + ',\'valor\',this.checked)"><span class="sw-sl"></span></label></div>';
    } else if (t === 'barra_libre') {
      h += '<div class="sw-row"><span style="font-size:13px">Incluir</span><label class="sw"><input type="checkbox"' + (s.valor ? ' checked' : '') + ' onchange="setS(' + i + ',\'valor\',this.checked)"><span class="sw-sl"></span></label></div>' +
        '<div class="fila"><input class="in" value="' + attr(s.horas) + '" placeholder="Duración" oninput="setS(' + i + ',\'horas\',this.value)"><input class="in" inputmode="decimal" value="' + attr(s.precio) + '" placeholder="€/persona" oninput="setS(' + i + ',\'precio\',n2(this.value))"></div>';
    } else if (t === 'recena') {
      h += '<div class="sw-row"><span style="font-size:13px">Incluir</span><label class="sw"><input type="checkbox"' + (s.valor ? ' checked' : '') + ' onchange="setS(' + i + ',\'valor\',this.checked)"><span class="sw-sl"></span></label></div>';
      (s.platos || []).forEach(function(p, j){
        h += '<div class="lst-row"><input class="in" value="' + attr(p.nombre) + '" placeholder="Plato" oninput="setRec(' + i + ',' + j + ',\'nombre\',this.value)"><input class="in" style="max-width:90px" inputmode="decimal" value="' + attr(p.precio) + '" placeholder="€" oninput="setRec(' + i + ',' + j + ',\'precio\',this.value)"></div>';
      });
      h += '<button class="btn btn-s btn-sm" onclick="ED.secciones[' + i + '].platos.push({nombre:\'\',precio:0});repintarEd()">+ Añadir plato</button>';
    }
    h += '</div>';
  });
  h += '<div class="add-sec">' +
    '<button class="btn btn-s btn-sm" onclick="addSec(\'plato\')">+ Plato</button>' +
    '<button class="btn btn-s btn-sm" onclick="addSec(\'lista\')">+ Lista de platos</button>' +
    '<button class="btn btn-s btn-sm" onclick="addSec(\'eleccion\')">+ A elegir</button>' +
    '<button class="btn btn-s btn-sm" onclick="addSec(\'sino\')">+ Sí / No</button>' +
    '<button class="btn btn-s btn-sm" onclick="addSec(\'barra_libre\')">+ Barra libre</button>' +
    '<button class="btn btn-s btn-sm" onclick="addSec(\'recena\')">+ Recena</button></div>';
  return h;
}
function repintarEd(){ var c = $('ed-secc'); if (c) c.innerHTML = htmlSecciones(); }
function addSec(t){
  var s = { tipo: t, titulo: { plato: 'Plato', lista: 'Entrantes', eleccion: 'Carne', sino: 'Sorbete', barra_libre: 'Barra libre', recena: 'Recena' }[t] };
  if (t === 'plato') s.texto = ''; if (t === 'lista') s.items = ['', '']; if (t === 'eleccion') { s.elegir = false; s.opciones = ['']; }
  if (t === 'sino') s.valor = true; if (t === 'barra_libre') { s.horas = '3,5 horas'; s.precio = 29.9; s.valor = true; }
  if (t === 'recena') { s.valor = true; s.platos = [{ nombre: '', precio: 0 }]; }

function pintarListaCeleb(tipo){
  var hoy = hoyISO();
  var prox = CELEBS.filter(function(c){ return c.fecha >= hoy; }), pas = CELEBS.filter(function(c){ return c.fecha < hoy; }).reverse();
  var h = '<div class="sec-tit">Próximas (' + prox.length + ')</div>' + (prox.map(itemCeleb).join('') || '<div class="vacio">No hay ninguna próxima</div>');

var DIA_SEL = null;
function pintarCalendario(tipo){
  if (!CAL[tipo]) CAL[tipo] = hoyISO().slice(0, 7);
  var ym = CAL[tipo].split('-').map(Number), y = ym[0], m = ym[1];
  var primero = new Date(y, m - 1, 1), offset = (primero.getDay() + 6) % 7;
  var dias = new Date(y, m, 0).getDate(), hoy = hoyISO();
  var porDia = {};
  CELEBS.forEach(function(c){ if (c.estado !== 'cancelada') (porDia[c.fecha] = porDia[c.fecha] || []).push(c); });
  var h = '<div class="card"><div class="cal-nav"><button onclick="moverMes(\'' + tipo + '\',-1)">&#8249;</button><b>' +
    mesTxt(y, m) + '</b><button onclick="moverMes(\'' + tipo + '\',1)">&#8250;</button></div><div class="cal">';
  ['L','M','X','J','V','S','D'].forEach(function(d){ h += '<div class="cal-h">' + d + '</div>'; });
  var inicio = new Date(y, m - 1, 1 - offset);
  var celdas = Math.ceil((offset + dias) / 7) * 7;
  for (var i = 0; i < celdas; i++) {
    var d = new Date(inicio.getFullYear(), inicio.getMonth(), inicio.getDate() + i);
    var iso = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    var ev = porDia[iso] || [];
    var cls = 'cal-d' + (d.getMonth() !== m - 1 ? ' otro' : '') + (iso === hoy ? ' hoy' : '') + (iso === DIA_SEL ? ' sel' : '');
    if (ev.length) cls += ev.some(function(c){ return c.estado === 'confirmada'; }) ? ' conf' : ' bloq';
    h += '<div class="' + cls + '" onclick="selDia(\'' + tipo + '\',\'' + iso + '\')"><span class="n">' + d.getDate() + '</span><span class="pt">' +
      ev.map(function(c){ return '<i class="' + (c.estado === 'confirmada' ? 'pt-v' : 'pt-a') + '"></i>'; }).join('') + '</span></div>';
  }
  h += '</div><div class="leyenda"><span><i style="background:var(--ambar)"></i>Bloqueada (sin fianza)</span><span><i style="background:var(--verde)"></i>Confirmada (fianza pagada)</span></div></div>';
  h += '<div id="dia-body"></div>';
  // Del mes visible
  var delMes = CELEBS.filter(function(c){ return c.fecha.slice(0, 7) === CAL[tipo]; });
  h += '<div class="sec-tit">Este mes (' + delMes.filter(function(c){ return c.estado !== 'cancelada'; }).length + ')</div>' + (delMes.map(itemCeleb).join('') || '<div class="vacio">No hay ' + TXT[tipo].plural.toLowerCase() + ' este mes</div>');
  $('cel-body').innerHTML = h;
  if (DIA_SEL) pintarDia(tipo);
}
function moverMes(tipo, d){
  var ym = CAL[tipo].split('-').map(Number), f = new Date(ym[0], ym[1] - 1 + d, 1);
  CAL[tipo] = f.getFullYear() + '-' + String(f.getMonth() + 1).padStart(2, '0'); DIA_SEL = null; pintarCalendario(tipo);
}
function selDia(tipo, iso){ DIA_SEL = iso; pintarCalendario(tipo); }
function pintarDia(tipo){

  var h = '<div class="sec-tit">' + esc(fechaLarga(DIA_SEL)) + '</div>' + ev.map(itemCeleb).join('');

  h += '<button class="btn btn-p" style="margin-bottom:6px" onclick="ir(\'#/celebracion/nueva/' + tipo + '/' + DIA_SEL + '\')">+ Bloquear esta fecha</button>';

}

function telWa(t){ t = String(t || '').replace(/\D/g, ''); return t.length === 9 ? '34' + t : t; }
function elegirMenuCeleb(id){
  CE.plantilla_id = id ? parseInt(id) : null;
  var p = (ST.plantillas || []).filter(function(x){ return String(x.id) === String(id); })[0];
  CE.menu_nombre = p ? p.nombre : '';
  if (p && Number(p.precio_persona) && !n2(CE.precio_adulto)) CE.precio_adulto = p.precio_persona;
  marcar();
}
function toggleFianza(v){
  CE.fianza_pagada = v; if (v && !CE.fianza_fecha) CE.fianza_fecha = hoyISO();
  $('ce-ffecha').style.display = v ? '' : 'none';
  var inp = $('ce-ffecha').querySelector('input'); if (inp) inp.value = CE.fianza_fecha || '';
  marcar(); calcImporte();
}
function calcImporte(){
  var e = $('ce-importe'); if (!e) return;
  var base = n2(CE.adultos) * n2(CE.precio_adulto) + n2(CE.ninos) * n2(CE.precio_nino);
  var cobrado = (CE.fianza_pagada ? n2(CE.fianza_importe) : 0) + (CE.pagos || []).reduce(function(a, p){ return a + n2(p.importe); }, 0);
  e.innerHTML = (base ? 'Importe previsto: <b>' + euros(base) + '</b> + IVA 10% = <b>' + euros(base * 1.1) + '</b>' : '') +
    (cobrado ? '<br>Cobrado: <b>' + euros(cobrado) + '</b>' + (base ? ' · Pendiente: <b>' + euros(base * 1.1 - cobrado) + '</b>' : '') : '');
}
function pintarPagos(){
  var c = $('ce-pagos'); if (!c) return;
  setTimeout(function(){ c.querySelectorAll('input').forEach(function(i){ i.addEventListener('input', calcImporte); }); calcImporte(); }, 0);
  if (!CE.pagos.length) { c.innerHTML = '<div class="muted" style="margin-bottom:8px">Sin pagos aparte de la fianza</div>'; return; }
  c.innerHTML = CE.pagos.map(function(p, i){
    return '<div class="sec" style="padding:8px"><div class="fila" style="margin-bottom:6px"><input class="in" type="date" value="' + attr(p.fecha) + '" oninput="CE.pagos[' + i + '].fecha=this.value;marcar()">' +
      '<input class="in" inputmode="decimal" placeholder="Importe €" value="' + attr(p.importe || '') + '" oninput="CE.pagos[' + i + '].importe=n2(this.value);marcar()"></div>' +
      '<input class="in" style="margin-bottom:6px" placeholder="Concepto (2º pago, liquidación…)" value="' + attr(p.concepto) + '" oninput="CE.pagos[' + i + '].concepto=this.value;marcar()">' +
      '<div class="fila"><select class="in" onchange="CE.pagos[' + i + '].forma=this.value;marcar()">' + ['', 'Transferencia', 'Tarjeta', 'Efectivo', 'Bizum'].map(function(f){ return '<option' + (p.forma === f ? ' selected' : '') + '>' + f + '</option>'; }).join('') + '</select>' +
      '<button class="mini" onclick="CE.pagos.splice(' + i + ',1);marcar();pintarPagos()">&#10005;</button></div></div>';
  }).join('');
}
function guardarCeleb(){
  if (!CE.fecha) return toast('Falta la fecha');
  // Aviso si ya hay otra boda o comunión ese mismo día
  api('GET', '/api/portal/celebraciones?desde=' + CE.fecha + '&hasta=' + CE.fecha).then(function(l){
    l = l.filter(function(c){ return c.id !== CE.id && c.estado !== 'cancelada'; });
    if (CE.estado !== 'cancelada' && l.length && !confirm('Ese día ya hay: ' + l.map(function(c){ return TXT[c.tipo].uno + ' ' + nombreCeleb(c); }).join(', ') + '. ¿Guardar igualmente?')) return;
    var nueva = !CE.id;
    return api(nueva ? 'POST' : 'PUT', '/api/portal/celebraciones' + (nueva ? '' : '/' + CE.id), CE).then(function(c){
      SUCIO = false; toast(c.estado === 'confirmada' ? 'Guardada · confirmada' : 'Guardada · fecha bloqueada');
      CAL[c.tipo] = c.fecha.slice(0, 7); DIA_SEL = c.fecha;
      if (nueva) ir('#/celebracion/' + c.id); else vCelebracion($('app'), c.id);
    });
  }).catch(fallo);
}
function cancelarCeleb(si){
  if (si && !confirm('¿Cancelar? La fecha quedará libre en el calendario.')) return;
  CE.estado = si ? 'cancelada' : 'bloqueada';
  api('PUT', '/api/portal/celebraciones/' + CE.id, CE).then(function(c){ SUCIO = false; toast(si ? 'Cancelada' : 'Reactivada'); vCelebracion($('app'), c.id); }).catch(fallo);
}
function borrarCeleb(){
  if (!confirm('¿Eliminar la ficha por completo? No se puede deshacer.')) return;
  api('DELETE', '/api/portal/celebraciones/' + CE.id).then(function(){ SUCIO = false; ir(rutaTipo(CE.tipo)); }).catch(fallo);
}

// ── Fechas de jornada (de 03:00 a 03:00, hora de España) ──
function jornadaHoy(){
  var t = new Date(Date.now() - 3 * 3600 * 1000);
  return new Intl.DateTimeFormat('sv-SE', { timeZone: 'Europe/Madrid' }).format(t);
}
function sumarDias(f, n){ var t = new Date(f + 'T12:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); }
function lunesDe(f){ var t = new Date(f + 'T12:00:00Z'); var d = (t.getUTCDay() + 6) % 7; return sumarDias(f, -d); }
function finMes(m){ var ym = m.split('-').map(Number); return m + '-' + String(new Date(ym[0], ym[1], 0).getDate()).padStart(2, '0'); }
function rangoPanel(modo, a, b){
  var hoy = jornadaHoy();
  if (modo === 'semana') { var l = lunesDe(a || hoy); return { desde: l, hasta: sumarDias(l, 6), modo: modo, ref: l }; }
  if (modo === 'mes') { var m = (a || hoy).slice(0, 7); return { desde: m + '-01', hasta: finMes(m), modo: modo, ref: m }; }
  if (modo === 'fechas') { var d = a || sumarDias(hoy, -6), h = b || hoy; if (h < d) { var x = d; d = h; h = x; } return { desde: d, hasta: h, modo: modo, ref: d + '/' + h }; }
  var dia = a || hoy; return { desde: dia, hasta: dia, modo: 'dia', ref: dia };
}
function moverRango(r, n){
  if (r.modo === 'dia') return '#/panel/dia/' + sumarDias(r.desde, n);
  if (r.modo === 'semana') return '#/panel/semana/' + sumarDias(r.desde, 7 * n);
  if (r.modo === 'mes') return '#/panel/mes/' + mesOtro(r.ref, n);
  var dias = Math.round((new Date(r.hasta) - new Date(r.desde)) / 864e5) + 1;
  return '#/panel/fechas/' + sumarDias(r.desde, dias * n) + '/' + sumarDias(r.hasta, dias * n);
}
function tituloRango(r){
  var hoy = jornadaHoy();
  var f = function(d, o){ return new Date(d + 'T12:00:00').toLocaleDateString('es-ES', o); };
  if (r.modo === 'dia') return (r.desde === hoy ? 'Hoy · ' : r.desde === sumarDias(hoy, -1) ? 'Ayer · ' : '') + f(r.desde, { weekday: 'long', day: 'numeric', month: 'long' });
  if (r.modo === 'semana') return 'Semana del ' + f(r.desde, { day: 'numeric', month: 'short' }) + ' al ' + f(r.hasta, { day: 'numeric', month: 'short' });
  if (r.modo === 'mes') { var ym = r.ref.split('-').map(Number); return mesTxt(ym[0], ym[1]); }
  return f(r.desde, { day: 'numeric', month: 'short', year: 'numeric' }) + ' — ' + f(r.hasta, { day: 'numeric', month: 'short', year: 'numeric' });
}

}

  // Facturado y cobrado

    '<div class="field"><label>Área</label><select onchange="TR.area=this.value;marcar()">' + ['', 'Cocina', 'Sala', 'Hotel', 'Limpieza', 'Mantenimiento', 'Administración'].map(function(a){ return '<option' + (t.area === a ? ' selected' : '') + '>' + a + '</option>'; }).join('') + '</select></div></div>' +
    '<div class="fila">' + cmp('Tipo de contrato', 'contrato', ' placeholder="Indefinido, temporal, fijo discontinuo…"') + cmp('Jornada', 'jornada', ' placeholder="Completa, parcial…"') + '</div>' +
    '<div class="fila">' + cmp('Horas por semana', 'horas_semana', ' inputmode="decimal"') + cmp('Salario bruto mensual (€)', 'salario', ' inputmode="decimal"') + '</div>' +
    '<div class="fila">' + cmp('Fecha de alta', 'fecha_alta', ' type="date"') + cmp('Fecha de baja', 'fecha_baja', ' type="date"') + '</div>' +
    cmp('Notas', 'notas') + '</div>';
  h += '<div class="card"><h3>Fichaje</h3><div class="fila">' + cmp('Clave para fichar (4 números)', 'pin', ' inputmode="numeric" maxlength="4"') +
    '<div class="field"><label>Qué puede hacer en el TPV</label><select onchange="TR.rol=this.value;marcar()">' + Object.keys(ROLES_TPV).map(function(r){ return '<option value="' + r + '"' + (t.rol === r ? ' selected' : '') + '>' + ROLES_TPV[r] + '</option>'; }).join('') + '</select></div></div>' +
    '<p class="muted">Con esta clave ficha entrada y salida en la app Fichaje. Si pones fecha de baja, la clave deja de funcionar.</p></div>';
  h += '<button class="btn btn-p" onclick="guardarTrabajador()">Guardar</button><div style="height:30px"></div></div></div>';
  $('app').innerHTML = h;
  if (!nuevo) cargarFichajes(mes);
}
function guardarTrabajador(){
  api('POST', '/api/portal/personal', TR).then(function(r){
    SUCIO = false; PERSONAL = null; toast('Ficha guardada');
    if (!TR.tpv_usuario_id) ir('#/trabajador/tpv' + r.tpv_usuario_id); else ir('#/personal');
  }).catch(fallo);
}
function hm(min){ return Math.floor(min / 60) + ' h ' + String(min % 60).padStart(2, '0') + ' min'; }
function cargarFichajes(mes){
  mes = /^\d{4}-\d{2}$/.test(mes || '') ? mes : mesActual();
  var base = '#/trabajador/tpv' + TR.tpv_usuario_id + '/';
  api('GET', '/api/portal/personal/' + TR.tpv_usuario_id + '/fichajes?mes=' + mes).then(function(d){
    var h = '<div class="card"><h3>Fichajes</h3>' + navMes(mes, base).replace('<div class="card">', '<div>') +
      '<div class="kpis" style="margin-top:10px"><div class="kpi"><small>Horas del mes</small><b>' + hm(d.total_minutos) + '</b></div><div class="kpi"><small>Días trabajados</small><b>' + d.dias.length + '</b></div></div>';
    h += d.dias.length ? '<table class="tabla"><tr><th>Día</th><th>Fichajes</th><th class="r">Horas</th></tr>' + d.dias.slice().reverse().map(function(x){
      return '<tr><td>' + esc(fechaSinAno(x.fecha)) + '</td><td>' + x.fichajes.map(function(f){
        return '<span class="badge ' + (f.tipo === 'entrada' ? 'b-verde' : 'b-oro') + '" style="margin:1px" title="' + (f.metodo === 'manual' ? 'Añadido a mano' : 'Fichado en el TPV') + '">' + (f.tipo === 'entrada' ? '&#8594; ' : '&#8592; ') + esc(f.hora) + (f.metodo === 'manual' ? '*' : '') +
          ' <a href="javascript:void 0" onclick="borrarFichaje(' + f.id + ',\'' + mes + '\')" style="text-decoration:none;color:#999">&#215;</a></span>';
      }).join(' ') + (x.sin_salida ? ' <span class="badge b-ambar">Sin salida</span>' : '') + '</td><td class="r">' + hm(x.minutos) + '</td></tr>';
    }).join('') + '</table>' : '<div class="muted" style="padding:8px 0">Sin fichajes este mes</div>';
    h += '<details style="margin-top:10px"><summary class="muted" style="cursor:pointer">Añadir un fichaje a mano (si se olvidó fichar)</summary><div class="fila" style="margin-top:8px">' +
      '<input class="in" type="date" id="fm-fecha" value="' + hoyISO() + '"><input class="in" type="time" id="fm-hora"><select class="in" id="fm-tipo"><option value="entrada">Entrada</option><option value="salida">Salida</option></select></div>' +
      '<button class="btn btn-s btn-sm" style="margin-top:8px" onclick="ficharManual(\'' + mes + '\')">Añadir</button></details>' +
      '<p class="muted" style="margin-top:8px">→ entrada · ← salida · * añadido a mano</p></div>';
    $('fich-body').innerHTML = h;
  }).catch(function(e){ $('fich-body').innerHTML = '<div class="card"><p class="muted">' + esc(e.message) + '</p></div>'; });
}
function ficharManual(mes){
  var f = $('fm-fecha').value, h = $('fm-hora').value;
  if (!f || !h) return toast('Pon fecha y hora');
  api('POST', '/api/portal/personal/' + TR.tpv_usuario_id + '/fichajes', { fecha: f, hora: h, tipo: $('fm-tipo').value }).then(function(){ toast('Fichaje añadido'); cargarFichajes(f.slice(0, 7)); }).catch(fallo);
}
function borrarFichaje(id, mes){
  if (!confirm('¿Borrar este fichaje?')) return;
  api('DELETE', '/api/portal/personal/fichajes/' + id).then(function(){ cargarFichajes(mes); }).catch(fallo);
}

// ════════════════════════════════════════════════════════════════════════
//  USUARIOS Y PERMISOS (solo administradores)
// ════════════════════════════════════════════════════════════════════════
var US = null;
function vUsuarios(app){
  app.innerHTML = '<div class="vista">' + cabecera('Usuarios y permisos', 'Quién entra y a qué', '#/', '<button class="acc" onclick="editarUsuario()">+ Nuevo</button>') +
    '<div class="content" id="us-body"><div class="cargando">Cargando…</div></div></div>';
  api('GET', '/api/portal/usuarios').then(function(d){
    US = d;
    var h = '<p class="muted" style="margin-bottom:12px">Cada persona entra con su PIN y solo ve los botones que tenga marcados. Los administradores lo ven todo y pueden gestionar los usuarios.</p>';
    d.usuarios.forEach(function(u, i){
      h += '<div class="item" onclick="editarUsuario(' + i + ')"><div class="tx"><b>' + esc(u.nombre) + (u.nombre === ST.usuario ? ' <span class="muted">(tú)</span>' : '') + '</b><small>' +
        (u.admin ? '<span class="badge b-oro">Administrador · todo</span>' : (u.modulos.map(function(m){ return NOMBRES_MOD[m]; }).join(' · ') || 'Sin acceso')) + '</small></div><div class="der">&#8250;</div></div>';
    });
    h += '<button class="btn btn-p" style="margin-top:8px" onclick="editarUsuario()">+ Nuevo usuario</button>';
    $('us-body').innerHTML = h;
  }).catch(fallo);
}
function editarUsuario(i){
  var u = i === undefined ? { nombre: '', pin: '', admin: false, modulos: [] } : clon(US.usuarios[i]);
  var nuevo = i === undefined;
  US.ant = nuevo ? null : u.nombre;
  var h = '<div class="card"><h3>' + (nuevo ? 'Nuevo usuario' : esc(u.nombre)) + '</h3>' +
    '<div class="field"><label>Nombre</label><input id="u-nombre" value="' + attr(u.nombre) + '"></div>' +
    '<div class="field"><label>PIN (4 números)</label><input id="u-pin" inputmode="numeric" maxlength="4" value="' + attr(u.pin) + '"></div>' +
    '<div class="sw-row" style="border-top:1px solid #f0ede8;padding-top:10px"><b>Administrador (acceso a todo)</b><label class="sw"><input type="checkbox" id="u-admin"' + (u.admin ? ' checked' : '') + ' onchange="$(\'u-mods\').style.opacity=this.checked?.4:1"><span class="sw-sl"></span></label></div>' +
    '<div id="u-mods" style="' + (u.admin ? 'opacity:.4' : '') + '"><div class="sec-tit" style="margin-top:10px">Puede entrar en</div>' +
    US.modulos.map(function(m){
      return '<div class="sw-row"><span>' + NOMBRES_MOD[m] + (m === 'hotel' || m === 'tpv' ? ' <span class="muted">(botón; la app tiene su propia clave)</span>' : '') + '</span><label class="sw"><input type="checkbox" class="u-mod" value="' + m + '"' + (u.modulos.indexOf(m) > -1 ? ' checked' : '') + '><span class="sw-sl"></span></label></div>';
    }).join('') + '</div></div>' +
    '<button class="btn btn-p" onclick="guardarUsuario(US.ant)">Guardar</button>' +
    '<button class="btn btn-s" onclick="vUsuarios($(\'app\'))">Cancelar</button>' +
    (nuevo || u.nombre === ST.usuario ? '' : '<button class="btn btn-d" onclick="borrarUsuario(US.ant)">Eliminar usuario</button>') +
    '<div style="height:30px"></div>';
  $('us-body').innerHTML = h;
  window.scrollTo(0, 0);
}
function guardarUsuario(anterior){
  var d = { anterior: anterior, nombre: $('u-nombre').value.trim(), pin: $('u-pin').value.trim(), admin: $('u-admin').checked,
    modulos: Array.prototype.slice.call(document.querySelectorAll('.u-mod:checked')).map(function(x){ return x.value; }) };
  api('POST', '/api/portal/usuarios', d).then(function(){
    toast('Usuario guardado');
    if (anterior === ST.usuario) { cargarSesion(); return; }
    vUsuarios($('app'));
  }).catch(fallo);
}
function borrarUsuario(n){
  if (!confirm('¿Eliminar a ' + n + '? Ya no podrá entrar con su PIN.')) return;
  api('DELETE', '/api/portal/usuarios/' + encodeURIComponent(n)).then(function(){ toast('Usuario eliminado'); vUsuarios($('app')); }).catch(fallo);
}

// ════════════════════════════════════════════════════════════════════════
//  ARRANQUE
// ════════════════════════════════════════════════════════════════════════
function cargarSesion(){
  return fetch('/api/sesion', { credentials: 'same-origin' }).then(function(r){
    if (!r.ok) { mostrarPin(); return; }
    return r.json().then(function(d){ ST.usuario = d.usuario; ST.admin = !!d.admin; ST.modulos = d.modulos || []; render(); });
  }).catch(function(){ mostrarPin(); });
}
cargarSesion();
if ('serviceWorker' in navigator) window.addEventListener('load', function(){ navigator.serviceWorker.register('/sw.js').catch(function(){}); });
</script>
