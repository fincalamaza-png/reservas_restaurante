<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Don Fadrique — Personal</title>
  <style>
    :root {
      --gold: #c9a84c;
      --dark: #1a1a1a;
      --dark2: #262626;
      --dark3: #333;
      --bg: #f5f0e8;
      --card: #fff;
      --text: #2a2a2a;
      --muted: #888;
      --red: #c0392b;
      --red-bg: #fde8e8;
      --purple: #8e44ad;
      --purple-bg: #f3e8fa;
      --blue: #2471a3;
      --blue-bg: #e8f4fd;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
           background: var(--bg); color: var(--text); min-height: 100vh;
           -webkit-font-smoothing: antialiased; }

    /* PIN */
    #pin-screen { display: flex; flex-direction: column; align-items: center;
                  justify-content: center; min-height: 100vh;
                  background: var(--dark); padding: 2rem 1.5rem; }
    .brand { text-align: center; margin-bottom: 2.5rem; }
    .brand-name { color: var(--gold); font-size: 1.9rem; font-weight: 300; letter-spacing: .15em; text-transform: uppercase; }
    .brand-sub  { color: var(--muted); font-size: .72rem; letter-spacing: .3em; text-transform: uppercase; margin-top: .4rem; }
    .pin-box { background: var(--dark2); border-radius: 16px; padding: 2rem 1.8rem;
               width: 100%; max-width: 320px; border: 1px solid #333; }
    .pin-prompt { color: #aaa; font-size: .78rem; text-align: center; letter-spacing: .12em;
                  text-transform: uppercase; margin-bottom: 1.8rem; }
    .pin-dots { display: flex; justify-content: center; gap: 1.2rem; margin-bottom: 2rem; }
    .pin-dot  { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--gold);
                transition: background .15s, transform .1s; }
    .pin-dot.filled { background: var(--gold); transform: scale(1.15); }
    .pin-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: .7rem; }
    .pin-btn  { background: var(--dark3); color: white; border: none; border-radius: 10px;
                padding: 1rem; font-size: 1.25rem; cursor: pointer;
                touch-action: manipulation; -webkit-tap-highlight-color: transparent; font-family: inherit; }
    .pin-btn:active { background: var(--gold); color: var(--dark); }
    .pin-btn.del { background: #3d2020; font-size: 1rem; }
    .pin-btn.ok  { background: var(--gold); color: var(--dark); font-weight: 700; }
    .pin-err { color: #e74c3c; text-align: center; font-size: .8rem; margin-top: 1.2rem; min-height: 1.2rem; }

    /* APP */
    #app { display: none; }
    .app-header { background: #fff; padding: .75rem 1rem;
                  display: flex; align-items: center; justify-content: space-between;
                  position: sticky; top: 0; z-index: 200; border-bottom: 1px solid #333; }
    .h-name { color: #8a6a20; font-size: .9rem; font-weight: 600; letter-spacing: .1em; }
    .h-date { color: #aaa; font-size: .65rem; margin-top: 1px; text-transform: capitalize; }
    .btn-salir { background: none; border: 1px solid #ccc; color: #999; padding: .3rem .7rem;
                 border-radius: 6px; font-size: .7rem; cursor: pointer; font-family: inherit; }

    /* CALENDARIO — compacto para móvil */
    .cal-wrap { background: #f8f5ef; padding: .5rem .5rem .6rem; border-bottom: 1px solid #ddd5c0; }
    .mes-nav { display: flex; align-items: center; justify-content: space-between; padding: 0 .2rem .45rem; }
    .mes-label { color: #2a2a2a; font-size: .85rem; font-weight: 600; letter-spacing: .05em; text-transform: capitalize; }
    .mes-btn { background: none; border: none; color: var(--gold); font-size: 1rem;
               cursor: pointer; padding: .15rem .6rem; border-radius: 5px; touch-action: manipulation; }
    .mes-btn:active { background: #333; }

    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }

    .cal-dow { text-align: center; font-size: .58rem; color: #999; padding: .15rem 0 .3rem;
               font-weight: 700; letter-spacing: .03em; text-transform: uppercase; }
    .cal-dow.fin { color: var(--gold); }

    .cal-cell { height: 34px; display: flex; flex-direction: column; align-items: center;
                justify-content: center; border-radius: 6px; cursor: pointer;
                background: #ece7de; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    .cal-cell.vacio { background: transparent; pointer-events: none; }
    .cal-num { font-size: .78rem; color: #333; font-weight: 500; line-height: 1; }
    .cal-dot { width: 3px; height: 3px; border-radius: 50%; background: transparent; margin-top: 2px; }

    .cal-cell.fin-sem .cal-num { color: #c08030; }
    .cal-cell.has-ev { background: #fff5d6 !important; }
    .cal-cell.has-ev .cal-num  { color: #7a5800; font-weight: 700; }
    .cal-cell.has-ev .cal-dot  { background: var(--gold); }
    .cal-cell.es-hoy { border: 1.5px solid var(--gold); }
    .cal-cell.es-hoy .cal-num { color: #7a5800; }
    .cal-cell.active { background: var(--gold) !important; }
    .cal-cell.active .cal-num { color: var(--dark); font-weight: 700; }
    .cal-cell.active .cal-dot { background: rgba(26,26,26,.5); }

    /* CONTENIDO */
    .content { padding: .85rem; }
    .section-head { display: flex; align-items: center; gap: .5rem; margin-bottom: .85rem; }
    .section-head h2 { font-size: .95rem; font-weight: 600; color: var(--dark); text-transform: capitalize; }
    .cnt-badge { background: var(--gold); color: var(--dark); border-radius: 20px;
                 padding: .1rem .5rem; font-size: .7rem; font-weight: 700; }
    .vacio { text-align: center; color: var(--muted); padding: 2.5rem 1rem; font-size: .88rem; }
    .vacio span { display: block; font-size: 2rem; margin-bottom: .5rem; }

    /* TARJETA */
    .r-card { background: var(--card); border-radius: 11px; margin-bottom: .8rem;
              overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.09); }
    .r-head { display: flex; align-items: center; gap: .65rem;
              padding: .75rem .9rem; border-bottom: 1px solid #f0ede6; }
    .r-hora   { font-size: 1.05rem; font-weight: 700; color: var(--gold); min-width: 44px; font-variant-numeric: tabular-nums; }
    .r-nombre { flex: 1; font-weight: 600; font-size: .9rem; color: var(--dark); }
    .r-badge  { font-size: .62rem; padding: .18rem .5rem; border-radius: 5px;
                font-weight: 700; text-transform: uppercase; letter-spacing: .05em; flex-shrink: 0; }
    .b-evento { background: #fef5e4; color: #a04000; }
    .b-menu   { background: #e8f8f0; color: #1a6b40; }
    .b-carta  { background: #eaf4fd; color: #1a4f7a; }
    .r-body { padding: .75rem .9rem; }
    .info-row { display: flex; flex-wrap: wrap; gap: .6rem; margin-bottom: .5rem; }
    .info-pill { display: flex; align-items: center; gap: .25rem; font-size: .78rem; color: #666; }
    .info-pill strong { color: var(--dark); font-weight: 600; }

    .alergias { background: var(--red-bg); border-left: 3px solid var(--red);
                border-radius: 0 7px 7px 0; padding: .5rem .75rem; margin-top: .55rem; }
    .alergias-ttl { color: var(--red); font-size: .67rem; font-weight: 700;
                    text-transform: uppercase; letter-spacing: .08em; margin-bottom: .18rem; }
    .alergias-txt { color: #7b1c1c; font-size: .8rem; line-height: 1.4; }

    .obs { background: #f8f7f4; border-radius: 6px; padding: .45rem .7rem;
           margin-top: .5rem; font-size: .76rem; color: #666; font-style: italic; line-height: 1.4; }

    .btn-orden { display: flex; align-items: center; justify-content: center; gap: .4rem;
                 width: 100%; margin-top: .65rem; background: none;
                 border: 1.5px solid var(--gold); color: var(--gold); border-radius: 7px;
                 padding: .55rem; font-size: .78rem; font-weight: 600; cursor: pointer;
                 font-family: inherit; touch-action: manipulation; }
    .btn-orden:active, .btn-orden.abierto { background: var(--gold); color: var(--dark); }

    .orden-wrap { display: none; margin-top: .65rem; border-top: 1.5px solid var(--gold); padding-top: .7rem; }
    .orden-wrap.visible { display: block; }
    .orden-ttl-main { font-size: .65rem; font-weight: 700; text-transform: uppercase;
                      letter-spacing: .14em; color: var(--gold); text-align: center; margin-bottom: .65rem; }
    .orden-bloque { border-radius: 7px; padding: .6rem .75rem; margin-bottom: .45rem; }
    .orden-bloque.menu-ev   { background: #fafaf7; }
    .orden-bloque.ninos-ev  { background: var(--purple-bg); border-left: 3px solid var(--purple); border-radius: 0 7px 7px 0; }
    .orden-bloque.bodega-ev { background: var(--blue-bg);   border-left: 3px solid var(--blue);   border-radius: 0 7px 7px 0; }
    .bloque-ttl { font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; margin-bottom: .4rem; }
    .orden-bloque.menu-ev   .bloque-ttl { color: var(--gold); }
    .orden-bloque.ninos-ev  .bloque-ttl { color: var(--purple); }
    .orden-bloque.bodega-ev .bloque-ttl { color: var(--blue); }
    .orden-row { display: flex; gap: .4rem; margin-bottom: .22rem; font-size: .78rem; }
    .orden-key { color: #999; min-width: 76px; flex-shrink: 0; }
    .orden-bloque.ninos-ev  .orden-key { color: #9b59b6; }
    .orden-bloque.bodega-ev .orden-key { color: #5d6d7e; }
    .orden-val { color: var(--dark); flex: 1; }
    .orden-bloque.ninos-ev .orden-val { color: #5b2c6f; }
    .refresh-note { text-align: center; font-size: .65rem; color: #bbb; padding: .4rem 0 .5rem; }
    .btn-listado { display: flex; align-items: center; justify-content: center; gap: .4rem;
                 width: 100%; margin-bottom: .85rem; background: var(--dark);
                 border: none; color: var(--gold); border-radius: 8px;
                 padding: .65rem; font-size: .82rem; font-weight: 600; cursor: pointer;
                 font-family: inherit; touch-action: manipulation; }
    .btn-listado:active { background: #333; }
  </style>
</head>
<body>

<div id="pin-screen">
  <div class="brand">
    <div class="brand-name">Don Fadrique</div>
    <div class="brand-sub">Consulta de reservas</div>
  </div>
  <div class="pin-box">
    <div class="pin-prompt">PIN de acceso</div>
    <div class="pin-dots">
      <div class="pin-dot" id="pd0"></div><div class="pin-dot" id="pd1"></div>
      <div class="pin-dot" id="pd2"></div><div class="pin-dot" id="pd3"></div>
    </div>
    <div class="pin-grid">
      <button class="pin-btn" onclick="addPin('1')">1</button>
      <button class="pin-btn" onclick="addPin('2')">2</button>
      <button class="pin-btn" onclick="addPin('3')">3</button>
      <button class="pin-btn" onclick="addPin('4')">4</button>
      <button class="pin-btn" onclick="addPin('5')">5</button>
      <button class="pin-btn" onclick="addPin('6')">6</button>
      <button class="pin-btn" onclick="addPin('7')">7</button>
      <button class="pin-btn" onclick="addPin('8')">8</button>
      <button class="pin-btn" onclick="addPin('9')">9</button>
      <button class="pin-btn del" onclick="delPin()">⌫</button>
      <button class="pin-btn" onclick="addPin('0')">0</button>
      <button class="pin-btn ok" onclick="checkPin()">✓</button>
    </div>
    <div class="pin-err" id="pin-err"></div>
  </div>
</div>

<div id="app">
  <div class="app-header">
    <div>
      <div class="h-name">DON FADRIQUE</div>
      <div class="h-date" id="h-date"></div>
    </div>
    <button class="btn-salir" onclick="logout()">Salir</button>
  </div>
  <div class="cal-wrap">
    <div class="mes-nav">
      <button class="mes-btn" onclick="cambiarMes(-1)">◀</button>
      <span class="mes-label" id="mes-label"></span>
      <button class="mes-btn" onclick="cambiarMes(1)">▶</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>
  <div class="content" id="content">
    <div class="vacio"><span>📅</span>Selecciona un día</div>
  </div>
</div>

<script>
const DIAS_L=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MESES_C=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
let pinOk='',pin='';
const hoy=new Date();
let mes=hoy.getMonth()+1,anio=hoy.getFullYear(),dia=hoy.getDate();
let cache=[],timerRef=null;
const pinSes=sessionStorage.getItem('df_pin');
if(pinSes)verificarPin(pinSes).then(ok=>{if(ok)abrirApp(pinSes);});
function addPin(d){if(pin.length>=4)return;pin+=d;dots();if(pin.length===4)setTimeout(checkPin,80);}
function delPin(){pin=pin.slice(0,-1);dots();document.getElementById('pin-err').textContent='';}
function dots(){for(let i=0;i<4;i++)document.getElementById('pd'+i).classList.toggle('filled',i<pin.length);}
async function checkPin(){if(pin.length<4)return;const ok=await verificarPin(pin);if(ok){sessionStorage.setItem('df_pin',pin);abrirApp(pin);}else{document.getElementById('pin-err').textContent='PIN incorrecto.';pin='';dots();}}
async function verificarPin(p){try{const r=await fetch('/api/personal/verificar-pin?pin='+encodeURIComponent(p));return(await r.json()).ok===true;}catch{return false;}}
function logout(){sessionStorage.removeItem('df_pin');pinOk='';pin='';dots();document.getElementById('pin-err').textContent='';document.getElementById('pin-screen').style.display='flex';document.getElementById('app').style.display='none';if(timerRef)clearInterval(timerRef);}
function abrirApp(p){pinOk=p;document.getElementById('pin-screen').style.display='none';document.getElementById('app').style.display='block';const ds=DIAS_L[hoy.getDay()];document.getElementById('h-date').textContent=ds[0].toUpperCase()+ds.slice(1)+', '+hoy.getDate()+' de '+MESES[hoy.getMonth()]+' '+hoy.getFullYear();cargarMes();timerRef=setInterval(cargarMes,5*60*1000);}
function cambiarMes(d){mes+=d;if(mes>12){mes=1;anio++;}if(mes<1){mes=12;anio--;}dia=(mes===hoy.getMonth()+1&&anio===hoy.getFullYear())?hoy.getDate():1;cargarMes();}
async function cargarMes(){document.getElementById('mes-label').textContent=MESES_C[mes-1]+' '+anio;try{const r=await fetch('/api/personal/reservas-mes?pin='+encodeURIComponent(pinOk)+'&mes='+mes+'&anio='+anio);if(r.status===401){logout();return;}cache=await r.json();renderCal();renderDia(dia);}catch{document.getElementById('content').innerHTML='<div class="vacio"><span>⚠️</span>Error de conexión</div>';}}
function renderCal(){
  const total=new Date(anio,mes,0).getDate();
  const conRes=new Set(cache.map(r=>parseInt(r.fecha.split('-')[2])));
  const esMesHoy=mes===hoy.getMonth()+1&&anio===hoy.getFullYear();
  let pd=new Date(anio,mes-1,1).getDay(); pd=pd===0?6:pd-1;
  let h='<div class="cal-dow">L</div><div class="cal-dow">M</div><div class="cal-dow">X</div><div class="cal-dow">J</div><div class="cal-dow">V</div><div class="cal-dow fin">S</div><div class="cal-dow fin">D</div>';
  for(let i=0;i<pd;i++)h+='<div class="cal-cell vacio"></div>';
  for(let d=1;d<=total;d++){
    const ds=(pd+d-1)%7,fin=ds>=5,esH=esMesHoy&&d===hoy.getDate(),tR=conRes.has(d),sel=d===dia;
    let cls='cal-cell'+(fin?' fin-sem':'')+(esH?' es-hoy':'')+(tR?' has-ev':'')+(sel?' active':'');
    h+=`<div class="${cls}" id="dc${d}" onclick="selDia(${d})"><span class="cal-num">${d}</span><span class="cal-dot"></span></div>`;
  }
  document.getElementById('cal-grid').innerHTML=h;
}
function selDia(d){dia=d;document.querySelectorAll('.cal-cell').forEach(c=>c.classList.remove('active'));const c=document.getElementById('dc'+d);if(c)c.classList.add('active');renderDia(d);setTimeout(()=>document.getElementById('content').scrollIntoView({behavior:'smooth',block:'start'}),80);}
function renderDia(d){
  const f=new Date(anio,mes-1,d),ds=DIAS_L[f.getDay()];
  const fStr=anio+'-'+String(mes).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  const lista=cache.filter(r=>r.fecha===fStr);
  const tit=ds[0].toUpperCase()+ds.slice(1)+' '+d+' de '+MESES[mes-1];
  if(!lista.length){document.getElementById('content').innerHTML='<div class="section-head"><h2>'+tit+'</h2></div><div class="vacio"><span>📋</span>Sin reservas</div>';return;}
  let h='<div class="section-head"><h2>'+tit+'</h2><span class="cnt-badge">'+lista.length+(lista.length===1?' reserva':' reservas')+'</span></div>';
  h+='<button class="btn-listado" onclick="abrirListadoPDF(\''+fStr+'\')">🖨️ Imprimir listado del día</button>';
  lista.forEach((r,i)=>{h+=card(r,i);});
  const n=new Date();
  h+='<div class="refresh-note">Actualizado '+n.getHours()+':'+String(n.getMinutes()).padStart(2,'0')+'</div>';
  document.getElementById('content').innerHTML=h;
}
function card(r,i){
  const ev=r.tipo==='evento';
  const bCls=ev?'b-evento':r.menu?'b-menu':'b-carta';
  const bTxt=ev?(r.tipo_evento||'Evento'):r.menu?'Menú '+r.menu:'Carta';
  const hora=r.hora?r.hora.substring(0,5):'—';
  const pax=r.ninos>0?r.pax+' adultos + '+r.ninos+' niños':r.pax+' personas';
  let h=`<div class="r-card"><div class="r-head"><span class="r-hora">${hora}</span><span class="r-nombre">${e(r.nombre)}</span><span class="r-badge ${bCls}">${e(bTxt)}</span></div><div class="r-body"><div class="info-row"><div class="info-pill">🏛️&nbsp;<strong>${e(r.salon||'—')}</strong></div><div class="info-pill">👥&nbsp;<strong>${pax}</strong></div>${r.montaje?'<div class="info-pill">📐&nbsp;<strong>'+e(r.montaje)+'</strong></div>':''}</div>`;
  if(r.alergias&&r.alergias.trim())h+=`<div class="alergias"><div class="alergias-ttl">⚠️ Alergias / Intolerancias</div><div class="alergias-txt">${e(r.alergias)}</div></div>`;
  if(r.obs&&r.obs.trim())h+=`<div class="obs">💬 ${e(r.obs)}</div>`;
  if(ev)h+=`<button class="btn-orden" onclick="abrirOrdenPDF(${r.id})">📋 Ver orden de servicio</button>`;
  return h+'</div></div>';
}
function orden(r){
  let h='<div class="orden-ttl-main">— Orden de servicio —</div>';
  const pl=[['Cóctel',r.coctel&&r.coctel!=='No'?(r.coctel_det||r.coctel):null],['Entrantes',r.entrantes],['Pescado',r.pescado],['Sorbete',r.sorbete],['Carne',r.carne],['Postre',r.postre]].filter(([,v])=>v);
  if(pl.length){h+='<div class="orden-bloque menu-ev"><div class="bloque-ttl">🍽️ Menú</div>';pl.forEach(([k,v])=>{h+=`<div class="orden-row"><span class="orden-key">${k}</span><span class="orden-val">${e(v)}</span></div>`;});h+='</div>';}
  if(r.ninos>0){h+=`<div class="orden-bloque ninos-ev"><div class="bloque-ttl">👦 Menú infantil — ${r.ninos} ${r.ninos===1?'niño':'niños'}</div>`;if(r.menu_ninos_entrante)h+=`<div class="orden-row"><span class="orden-key">Entrante</span><span class="orden-val">${e(r.menu_ninos_entrante)}</span></div>`;if(r.menu_ninos_principal)h+=`<div class="orden-row"><span class="orden-key">Principal</span><span class="orden-val">${e(r.menu_ninos_principal)}</span></div>`;if(r.menu_ninos_postre)h+=`<div class="orden-row"><span class="orden-key">Postre</span><span class="orden-val">${e(r.menu_ninos_postre)}</span></div>`;h+='</div>';}
  const vi=[['Blanco',r.vino_blanco],['Tinto',r.vino_tinto],['Cava',r.vino_cava]].filter(([,v])=>v);
  if(vi.length){h+='<div class="orden-bloque bodega-ev"><div class="bloque-ttl">🍷 Bodega</div>';vi.forEach(([k,v])=>{h+=`<div class="orden-row"><span class="orden-key">${k}</span><span class="orden-val">${e(v)}</span></div>`;});h+='</div>';}
  if(!pl.length&&!(r.ninos>0)&&!vi.length)h+='<div style="text-align:center;color:#aaa;font-size:.78rem;padding:.5rem 0">Sin detalles de menú aún</div>';
  return h;
}
function togOrden(i){const w=document.getElementById('ow'+i),b=document.getElementById('bo'+i),a=w.classList.toggle('visible');b.classList.toggle('abierto',a);b.textContent=a?'▲ Cerrar orden':'📋 Ver orden de servicio';}
function abrirOrdenPDF(id){ window.open('/api/personal/orden-pdf/'+id+'?pin='+encodeURIComponent(pinOk),'_blank'); }
function abrirListadoPDF(fecha){ window.open('/api/personal/listado-pdf?pin='+encodeURIComponent(pinOk)+'&fecha='+fecha,'_blank'); }
function e(t){if(t==null)return'';return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
</script>
</body>
</html>
