<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menú · Don Fadrique</title>
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<meta name="theme-color" content="#1a1a1a">
<style id="estilo-base">
*{box-sizing:border-box;margin:0;padding:0}
body{background:#e9e4dc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1a1a1a;min-height:100vh}
.barra{position:sticky;top:0;z-index:5;background:#1a1a1a;color:#fff;display:flex;align-items:center;gap:8px;padding:10px 12px;flex-wrap:wrap}
.barra .tit{flex:1;min-width:120px;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra button{background:#2c2c2c;color:#fff;border:none;border-radius:8px;padding:9px 12px;font-size:13px;font-weight:600;cursor:pointer}
.barra button.oro{background:#b8965a}
.barra select{background:#2c2c2c;color:#fff;border:none;border-radius:8px;padding:9px 8px;font-size:13px}
#escena{padding:16px 0 40px;overflow:hidden}
#lienzo{transform-origin:top left}
.aviso{max-width:420px;margin:60px auto;text-align:center;color:#6d6257;font-size:15px;padding:0 20px}
@media print{
  body{background:#fff}
  .barra{display:none!important}
  #escena{padding:0!important;height:auto!important}
  #lienzo{transform:none!important;width:auto!important}
}
</style>
<style id="estilo-pagina">@page{size:A4 portrait;margin:0}</style>
</head>
<body>
<div class="barra" id="barra" style="display:none">
  <button id="b-volver" onclick="volver()">&#8592;</button>
  <div class="tit" id="titulo">Menú</div>
  <select id="formato" onchange="cambiarFormato(this.value)" style="display:none">
    <option value="a4">A4 vertical</option>
    <option value="triptico">Tríptico A4 horizontal</option>
  </select>
  <button id="b-compartir" onclick="compartir()" style="display:none">Compartir</button>
  <button class="oro" onclick="window.print()">Imprimir / PDF</button>
</div>
<div id="escena"><div id="lienzo"></div></div>
<script src="/menu-render.js"></script>
<script>
var MENU = null, TOKEN = null, PUBLICO = false;
document.getElementById('estilo-base').insertAdjacentHTML('afterend', '<style>' + DFMenu.css + '</style>');

function volver(){ if (history.length > 1) history.back(); else location.href = '/'; }

function pintar(){
  var f = MENU.formato === 'triptico' ? 'triptico' : 'a4';
  document.getElementById('estilo-pagina').textContent = '@page{size:A4 ' + (f === 'triptico' ? 'landscape' : 'portrait') + ';margin:0}';
  var lienzo = document.getElementById('lienzo');
  lienzo.innerHTML = f === 'triptico' ? DFMenu.triptico(MENU) : DFMenu.a4(MENU);
  document.getElementById('formato').value = f;
  var listo = function(){ DFMenu.ajustar(lienzo); escalar(); };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(listo); else setTimeout(listo, 300);
  setTimeout(listo, 60);
}
// En el móvil la hoja se ve reducida para que quepa en pantalla
function escalar(){
  var lienzo = document.getElementById('lienzo'), hoja = lienzo.firstElementChild;
  if (!hoja) return;
  var ancho = hoja.offsetWidth, alto = hoja.offsetHeight;
  var k = Math.min(1, (window.innerWidth - 24) / ancho);
  lienzo.style.width = ancho + 'px';
  lienzo.style.transform = 'translateX(' + Math.max(12, (window.innerWidth - ancho * k) / 2) + 'px) scale(' + k + ')';
  document.getElementById('escena').style.height = (alto * k + 56) + 'px';
}
window.addEventListener('resize', escalar);
window.addEventListener('beforeprint', function(){ DFMenu.ajustar(document.getElementById('lienzo')); });

function cambiarFormato(v){
  MENU.formato = v; pintar();
}

function enlacePublico(){ return location.origin + '/menu/' + TOKEN; }
function compartir(){
  var url = enlacePublico();
  var texto = (MENU.titulo || 'Menú') + ' · Don Fadrique';
  if (navigator.share) { navigator.share({ title: texto, text: texto, url: url }).catch(function(){}); return; }
  window.open('https://wa.me/?text=' + encodeURIComponent(texto + ' ' + url), '_blank');
}

function error(msg){
  document.getElementById('lienzo').innerHTML = '<div class="aviso">' + DFMenu.esc(msg) + '</div>';
  document.getElementById('lienzo').style.transform = 'none';
}

(function iniciar(){
  var m = location.pathname.match(/^\/menu\/([a-f0-9]+)/i);
  var q = new URLSearchParams(location.search);
  var url;
  if (m) { PUBLICO = true; TOKEN = m[1]; url = '/api/publico/menu/' + TOKEN; }
  else if (q.get('plantilla')) url = '/api/portal/plantillas';
  else if (q.get('personalizado')) url = '/api/portal/personalizados/' + encodeURIComponent(q.get('personalizado'));
  else return error('No se ha indicado ningún menú.');

  var barra = document.getElementById('barra');
  barra.style.display = 'flex';
  if (PUBLICO) { document.getElementById('b-volver').style.display = 'none'; }
  else document.getElementById('formato').style.display = '';

  fetch(url, { credentials: 'same-origin' }).then(function(r){
    if (r.status === 401) { location.href = '/'; throw new Error('sin sesión'); }
    return r.json().then(function(d){ if (!r.ok) throw new Error(d.error || 'Error'); return d; });
  }).then(function(d){
    if (q.get('plantilla')) {
      d = (d || []).filter(function(p){ return String(p.id) === q.get('plantilla'); })[0];
      if (!d) throw new Error('Menú no encontrado');
      d.titulo = d.nombre;
    }
    if (!PUBLICO && d.token) TOKEN = d.token;
    if (TOKEN) document.getElementById('b-compartir').style.display = '';
    if (q.get('formato')) d.formato = q.get('formato');
    MENU = d;
    document.getElementById('titulo').textContent = d.titulo || 'Menú';
    document.title = (d.titulo || 'Menú') + ' · Don Fadrique';
    pintar();
    if (q.get('imprimir') === '1') setTimeout(function(){ window.print(); }, 700);
  }).catch(function(e){ if (e.message !== 'sin sesión') error(e.message); });
})();
</script>
</body>
</html>
